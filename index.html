  // 작은 캔버스에 캐릭터 그리기 (data-mini="id", data-mode="face" 이면 얼굴 위주)
  function drawMinis(root = overlay) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (const c of root.querySelectorAll('canvas[data-mini]')) {
      const r = c.getBoundingClientRect(), w = r.width || 52, h = r.height || 52;
      c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
      const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
      const P = FT.pose(null, 0.6);
      if (c.dataset.mode === 'face') FT.draw(x, w / 2, h * 1.52, w * 1.1, P, 0.6, c.dataset.mini);
      else FT.draw(x, w / 2, h * 0.84, h * 0.5, P, 0.6, c.dataset.mini);
    }
  }
  function charBtnHtml() {
    const n = unseen().length;
    return `<button class="charBtn" data-act="chars"><canvas data-mini="${prof.sel}" data-mode="face"></canvas>
      <span><b>캐릭터</b><small>💰 ${prof.coins} · ${FT.LIST.filter(isOpen).length}/${FT.LIST.length}</small></span>${n ? `<i class="dotN">NEW ${n}</i>` : ''}</button>`;
  }
  function gainHtml() {
    if (!lastRun || lastRun.earned == null) return '';
    const nw = lastRun.newly || [];
    return `<div class="gain"><div class="cg">💰 +${lastRun.earned} 코인 <span style="color:#c9cdf0;font-size:13px">(보유 ${prof.coins})</span></div>
      ${nw.map(c => `<div class="unl"><canvas data-mini="${c.id}" data-mode="face"></canvas><div>🎉 새 캐릭터 해금!<br><span style="color:#ffd166">${c.name}</span></div>
        <button data-act="chars" data-id="${c.id}">보기</button></div>`).join('')}</div>`;
  }

  function showChars(id) {
    overlay.classList.remove('titleBg', 'hidden'); overlay.classList.add('charsBg');
    csView = id || prof.sel; csTab = 'all'; csAnim = {type: 'win', t0: performance.now() / 1000};
    renderChars(true);
    overlay.scrollTop = 0;
    cancelAnimationFrame(csRaf); csRaf = requestAnimationFrame(csLoop);
  }
  function renderChars(first) {
    const ch = FT.byId(csView), R = FT.RARITY[ch.rar], open = isOpen(ch), u = ch.unlock;
    let act;
    if (prof.sel === ch.id) act = `<button class="csBtn off" disabled>선택 완료 <svg class="ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5l5 5L19.5 7" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;
    else if (open) act = `<button class="csBtn green" data-act="pick">선택하기</button>`;
    else if (u.t === 'coin') {
      const ok = prof.coins >= u.p;
      act = `<button class="csBtn ${ok ? '' : 'off'}" data-act="buy">💰 ${u.p} 구매${ok ? '' : `<small>코인이 ${u.p - prof.coins}개 부족해요</small>`}</button>`;
    } else {
      const k = Math.min(1, condNow(u) / condGoal(u));
      act = `<button class="csBtn off" disabled>🔒 ${condText(u)} 달성 시 해금<small>${condNow(u)} / ${condGoal(u)}</small></button>
        <div class="csProg"><i style="width:${(k * 100).toFixed(0)}%"></i></div>`;
    }
    const tabs = [['all', '전체', '#1a2560'], ...Object.entries(FT.RARITY).map(([k, r]) => [k, r.name, r.d])];
    const cards = FT.LIST.filter(c => csTab === 'all' || c.rar === csTab).map(c => {
      const r = FT.RARITY[c.rar], o = isOpen(c);
      return `<button class="card${o ? '' : ' lock'}${c.id === csView ? ' view' : ''}" data-act="card" data-id="${c.id}" style="--a:${r.card[0]};--b:${r.card[1]}">
        <canvas data-mini="${c.id}"></canvas><span class="cn">${c.name}</span>
        ${c.id === prof.sel ? '<span class="badge">선택 완료</span>' : (o && !seen.includes(c.id) ? '<span class="nw">NEW</span>' : '')}
        ${o ? '' : `<i class="lk">🔒</i><span class="cond">${condText(c.unlock)}</span>`}</button>`;
    }).join('');
    if (first) {
      overlay.innerHTML = `<div class="cs">
        <div class="csTop"><button class="csBack" data-act="back" aria-label="뒤로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4.5L7.5 12l7.5 7.5" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="csTitle">캐릭터</div><div class="csCoin">💰 <span id="csCoins"></span></div></div>
        <div class="csStage" data-act="stage"><canvas id="csCv"></canvas>
          <div class="csPlate"><div class="csName"></div><div class="csRar"></div></div></div>
        <div class="csDesc"></div><div class="csAct"></div>
        <div class="csTabs"></div><div class="csGrid"></div>
        <div class="csStats"></div></div>`;
    }
    const q = sel => overlay.querySelector(sel);
    q('#csCoins').textContent = prof.coins;
    q('.csName').textContent = ch.name;
    q('.csRar').textContent = R.name; q('.csRar').style.background = R.c;
    q('.csDesc').textContent = ch.desc + ' · 탭하면 격파 시범';
    q('.csAct').innerHTML = act;
    q('.csTabs').innerHTML = tabs.map(([k, n, c]) => `<button class="csTab${csTab === k ? ' on' : ''}" data-act="tab" data-r="${k}" style="--c:${c}">${n}</button>`).join('');
    q('.csGrid').innerHTML = cards;
    q('.csStats').innerHTML = `플레이 ${prof.plays}판 · 최고 ${best.score}점<br>판자 1개 = 💰1 · 스테이지 넘을 때마다 💰10 보너스`;
    drawMinis(q('.csGrid'));
    if (open && !seen.includes(ch.id)) { seen.push(ch.id); try { localStorage.setItem(seenKey, JSON.stringify(seen)); } catch (e) {} }
  }
  function csLoop(ms) {
    const cv2 = document.getElementById('csCv');
    if (!cv2 || !overlay.classList.contains('charsBg')) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2), r = cv2.getBoundingClientRect();
    if (cv2.width !== Math.round(r.width * dpr) || cv2.height !== Math.round(r.height * dpr)) { cv2.width = Math.round(r.width * dpr); cv2.height = Math.round(r.height * dpr); }
    const x = cv2.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, r.width, r.height);
    const t = ms / 1000, S = Math.min(r.height * 0.55, r.width * 0.5), fx = r.width / 2, fy = r.height * 0.84;
    const g = x.createRadialGradient(fx, fy, 0, fx, fy, S * 1.2);
    g.addColorStop(0, 'rgba(255,255,255,.6)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.beginPath(); x.ellipse(fx, fy, S * 1.2, S * 0.28, 0, 0, Math.PI * 2); x.fill();
    const P = FT.pose(csAnim, t);
    if (P.event === 'hit') {
      const st = overlay.querySelector('.csStage'), d = document.createElement('div');
      d.className = 'pop2'; d.textContent = ['얍!', '하앗!', '빡!'][Math.floor(Math.random() * 3)];
      d.style.left = (fx + csSide * S * 0.6 - 30) + 'px'; d.style.top = (fy - S * 1.55) + 'px';
      st.appendChild(d); setTimeout(() => d.remove(), 700);
      try { hitSound(csSide < 0, 0); } catch (e) {}
    }
    FT.draw(x, fx, fy, S, P, t, csView);
    csRaf = requestAnimationFrame(csLoop);
  }
  function previewChop() { csSide = -csSide; csAnim = {type: 'chop', side: csSide, t0: performance.now() / 1000, hit: false}; }
  function buyChar() {
    const ch = FT.byId(csView), u = ch.unlock;
    if (u.t !== 'coin' || isOpen(ch)) return;
    if (prof.coins < u.p) { beep(180, 0.15, 'square', 0.05); return; }
    prof.coins -= u.p; prof.owned.push(ch.id); selectChar(ch.id);
    if (!seen.includes(ch.id)) seen.push(ch.id);
    csAnim = {type: 'win', t0: performance.now() / 1000};
    beep(523, 0.1, 'triangle', 0.06); setTimeout(() => beep(784, 0.1, 'triangle', 0.06), 90); setTimeout(() => beep(1047, 0.2, 'triangle', 0.06), 180);
    renderChars();
  }
  function pickChar() {
    if (!isOpen(FT.byId(csView))) return;
    selectChar(csView); csAnim = {type: 'win', t0: performance.now() / 1000};
    beep(660, 0.08, 'triangle', 0.05); setTimeout(() => beep(990, 0.14, 'triangle', 0.05), 80);
    renderChars();
  }

  overlay.addEventListener('pointerdown', e => e.stopPropagation());
  const quitBtn = document.getElementById('quitBtn');
  quitBtn.addEventListener('pointerdown', e => e.stopPropagation());
  quitBtn.addEventListener('click', () => { practice = false; quitBtn.classList.add('hidden'); state = 'title'; queue = []; made = 0; fill(); showOverlay('title'); });
  overlay.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act;
    if (a === 'reg') { const inp = document.getElementById('nameIn'); if (inp) register(inp.value); }
    else if (a === 'start') startGame();
    else if (a === 'practice') startGame(true);
    else if (a === 'chars') showChars(b.dataset.id);
    else if (a === 'back') showOverlay(backTo.kind, backTo.isBest);
    else if (a === 'tab') { csTab = b.dataset.r; renderChars(); }
    else if (a === 'card') { csView = b.dataset.id; csAnim = {type: 'win', t0: performance.now() / 1000}; renderChars(); }
    else if (a === 'buy') buyChar();
    else if (a === 'pick') pickChar();
    else if (a === 'stage') previewChop();
  });
  game.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    e.preventDefault();
    const r = game.getBoundingClientRect();
    press(e.clientX - r.left < r.width / 2 ? 0 : 1);
  });
  window.addEventListener('keydown', e => {
    if (e.repeat || (e.target && e.target.tagName === 'INPUT')) return;
    if (state === 'play') {
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) press(0);
      if (['ArrowRight', 'd', 'D'].includes(e.key)) press(1);
    } else if ((e.key === 'Enter' || e.key === ' ') && !overlay.classList.contains('hidden')) startGame();
  });

  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (hitstop > 0) { hitstop -= dt; update(dt * 0.12); } else update(dt);
    draw(now / 1000);
    requestAnimationFrame(loop);
  }
  fill(); paintButtons(); hud();
  showOverlay('title');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
